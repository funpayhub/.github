name: Telegram push notification

on:
  workflow_call:
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !github.event.deleted
    permissions:
      contents: read
    steps:
      - uses: funpayhub/.github/actions/telegram-push-notify@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ vars.TELEGRAM_CHAT_ID }}
          thread-id: ${{ vars.TELEGRAM_THREAD_ID }}
