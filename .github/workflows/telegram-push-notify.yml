name: Telegram push notification

on:
  workflow_call:
    secrets:
      TELEGRAM_NOTIFICATIONS_BOT_TOKEN:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !github.event.deleted
    permissions:
      contents: read
    steps:
      - uses: funpayhub/.github/actions/telegram-push-notify@master
        with:
          bot-token: ${{ secrets.TELEGRAM_NOTIFICATIONS_BOT_TOKEN }}
          chat-id: ${{ vars.TELEGRAM_PUSH_NOTIFICATIONS_CHAT_ID }}
          thread-id: ${{ vars.TELEGRAM_PUSH_NOTIFICATIONS_CHAT_THREAD }}
